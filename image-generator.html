<!-- OMNIAI AI IMAGE GENERATION COMPONENT -->

<div class="omniai-image-generator">

  <div class="omniai-header">
    <h1>AI Image Generation</h1>
    <p>Create futuristic AI-generated images instantly.</p>
  </div>

  <div class="omniai-generator-box">

    <textarea 
      id="omniaiPrompt"
      placeholder="Describe your image..."
    ></textarea>

    <!-- 🌟 Neural Core Prompt Presets -->
    <div class="preset-prompts-container">
      <p class="preset-label">Neural Core Prompt Presets ("Everything")</p>
      
      <div class="preset-row">
        <span class="preset-category">Vehicles</span>
        <button class="preset-pill" data-prompt="A futuristic glowing cyberpunk hypercar driving fast through rain-slick neon-lit streets, high speed motion blur, octane render, 8k">Cyberpunk Hypercar 🚗</button>
        <button class="preset-pill" data-prompt="A chrome electric motorcycle chopper parked under a holographic billboard in a futuristic Tokyo alleyway, neon cyberpunk">Quantum Chopper 🏍️</button>
        <button class="preset-pill" data-prompt="A heavy transport cargo truck driving on a mountain pass during a snowstorm at night, volumetric lighting, photorealistic 8k">Heavy Rig 🚚</button>
        <button class="preset-pill" data-prompt="A retro Volkswagen camper van parked on a cliff overlooking the ocean under a starry night sky, cozy campfire glow">Camper Van 🚐</button>
      </div>

      <div class="preset-row">
        <span class="preset-category">Animals</span>
        <button class="preset-pill" data-prompt="A magnificent cybernetic lion with glowing neon-blue circuits, standing proudly on top of an obsidian peak, hyper-realistic">Cybernetic Lion 🦁</button>
        <button class="preset-pill" data-prompt="A flock of fluffy sheep grazing in a lush green highland pasture under a beautiful golden sunset, warm rays, watercolor style">Fluffy Sheep 🐑</button>
        <button class="preset-pill" data-prompt="A glowing Bengal tiger prowling through a dark rainforest, vibrant neon-orange and purple bioluminescent flora, octane render">Neon Tiger 🐯</button>
        <button class="preset-pill" data-prompt="A rugged Scottish highland cow standing on a misty hill, realistic oil painting, detailed long fur, moody atmosphere">Highland Cow 🐮</button>
        <button class="preset-pill" data-prompt="A majestic golden eagle rising from ashes, wings made of glowing embers and fire, epic cinematic fantasy illustration">Phoenix Eagle 🦅</button>
      </div>

      <div class="preset-row">
        <span class="preset-category">Sci-Fi & Art</span>
        <button class="preset-pill" data-prompt="A photorealistic render of a cyberpunk penthouse overlooking a glowing neon metropolis, cinematic lighting, 8k resolution">Neon Metropolis 🏙️</button>
        <button class="preset-pill" data-prompt="A massive circular space portal opening in deep space, swirling stars and nebula colors, high-end sci-fi digital art">Cosmic Gateway 🌌</button>
        <button class="preset-pill" data-prompt="A colorful kingfisher bird perched on a branch, soft watercolor splash style, delicate pigment bleeds">Watercolor Kingfisher 🐦</button>
        <button class="preset-pill" data-prompt="A premium plate of futuristic neon-lit sushi on a glowing glass bar, vaporwave aesthetic, highly detailed 3D render">Neon Sushi 🍣</button>
      </div>
    </div>

    <button id="generateBtn">
      Generate Image
    </button>

  </div>

  <div class="loading-box" id="loadingBox">
    <div class="loader"></div>
    <p>OMNIAI is generating your image...</p>
  </div>

  <div class="result-box" id="resultBox">
    <img id="generatedImage" src="" />
  </div>

</div>

<style>

body{
  background:#060816;
  font-family:Inter,sans-serif;
  margin: 0;
  padding: 0;
}

.omniai-image-generator{
  width:100%;
  min-height:100vh;
  box-sizing: border-box;
  padding:40px;
  color:white;
}

.omniai-header h1{
  font-size:52px;
  font-weight:800;
  margin-bottom:10px;
}

.omniai-header p{
  color:#94a3b8;
  font-size:18px;
}

.omniai-generator-box{
  margin-top:40px;
  background:rgba(255,255,255,0.04);
  border:1px solid rgba(255,255,255,0.08);
  backdrop-filter:blur(20px);
  border-radius:24px;
  padding:30px;
}

textarea{
  width:100%;
  height:140px;
  border:none;
  outline:none;
  resize:none;
  border-radius:18px;
  padding:20px;
  background:#0f172a;
  color:white;
  font-size:16px;
  box-sizing: border-box;
}

textarea::placeholder{
  color:#64748b;
}

button{
  margin-top:20px;
  padding:16px 32px;
  border:none;
  border-radius:16px;
  background:linear-gradient(90deg,#00d4ff,#7b61ff);
  color:white;
  font-size:16px;
  font-weight:600;
  cursor:pointer;
  transition:0.3s;
}

button:hover{
  transform:scale(1.03);
  box-shadow:0 0 25px rgba(0,212,255,0.4);
}

.loading-box{
  display:none;
  margin-top:30px;
  text-align:center;
}

.loader{
  width:60px;
  height:60px;
  border:6px solid rgba(255,255,255,0.1);
  border-top:6px solid #00d4ff;
  border-radius:50%;
  margin:auto;
  animation:spin 1s linear infinite;
}

@keyframes spin{
  100%{
    transform:rotate(360deg);
  }
}

.loading-box p{
  margin-top:16px;
  color:#94a3b8;
}

.result-box{
  margin-top:40px;
  display:none;
}

.result-box img{
  width:100%;
  border-radius:24px;
  border:1px solid rgba(255,255,255,0.08);
  box-shadow:0 0 40px rgba(0,212,255,0.12);
}

.preset-prompts-container {
  margin-top: 25px;
  border-top: 1px solid rgba(255,255,255,0.06);
  padding-top: 20px;
  margin-bottom: 10px;
}
.preset-label {
  font-size: 11px;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 0.12em;
  color: rgba(255,255,255,0.4);
  margin-top: 0;
  margin-bottom: 15px;
}
.preset-row {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
  margin-bottom: 12px;
  border-bottom: 1px solid rgba(255,255,255,0.02);
  padding-bottom: 10px;
}
.preset-row:last-child {
  border-bottom: none;
  padding-bottom: 0;
}
.preset-category {
  font-size: 9px;
  font-weight: 900;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: rgba(255,255,255,0.25);
  min-width: 100px;
}
.preset-pill {
  margin-top: 0 !important;
  background: rgba(255,255,255,0.02) !important;
  border: 1px solid rgba(255,255,255,0.06) !important;
  padding: 6px 12px !important;
  font-size: 11px !important;
  font-weight: 500 !important;
  border-radius: 8px !important;
  color: rgba(255,255,255,0.6) !important;
  cursor: pointer !important;
  transition: all 0.2s !important;
}
.preset-pill:hover {
  background: rgba(255,255,255,0.06) !important;
  border-color: rgba(123,97,255,0.3) !important;
  color: white !important;
  transform: scale(1.02) !important;
  box-shadow: none !important;
}

</style>

<script>

// Hook up Neural Core Prompt Presets click listener
document.querySelectorAll(".preset-pill").forEach(button => {
  button.addEventListener("click", () => {
    document.getElementById("omniaiPrompt").value = button.getAttribute("data-prompt");
  });
});

const generateBtn = document.getElementById("generateBtn");

generateBtn.addEventListener("click", async () => {

  const prompt = document.getElementById("omniaiPrompt").value;

  if(!prompt){
    alert("Please enter an image prompt");
    return;
  }

  const loadingBox = document.getElementById("loadingBox");
  const resultBox = document.getElementById("resultBox");
  const generatedImage = document.getElementById("generatedImage");

  // Success handler: hide loading, show image
  generatedImage.onload = () => {
    loadingBox.style.display = "none";
    resultBox.style.display = "block";
  };

  // Error catcher: intercept rate limits/broken images and swap for curated sci-fi assets
  generatedImage.onerror = () => {
    console.warn("Client-side image load failed. Engaging pre-curated futuristic visual fallback.");
    
    const cities = [
      "https://images.unsplash.com/photo-1578894381163-e72c17f2d45f?q=80&w=1024&auto=format&fit=crop",
      "https://images.unsplash.com/photo-1509198397868-475647b2a1e5?q=80&w=1024&auto=format&fit=crop",
      "https://images.unsplash.com/photo-1540959733332-eab4deceeaf7?q=80&w=1024&auto=format&fit=crop",
      "https://images.unsplash.com/photo-1508849789987-4e5333c12b78?q=80&w=1024&auto=format&fit=crop",
      "https://images.unsplash.com/photo-1519608487953-e999c86e7455?q=80&w=1024&auto=format&fit=crop"
    ];
    
    const robots = [
      "https://images.unsplash.com/photo-1589254065878-42c9da997008?q=80&w=1024&auto=format&fit=crop",
      "https://images.unsplash.com/photo-1535223289827-42f1e9919769?q=80&w=1024&auto=format&fit=crop",
      "https://images.unsplash.com/photo-1485827404703-89b55fcc595e?q=80&w=1024&auto=format&fit=crop",
      "https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=1024&auto=format&fit=crop",
      "https://images.unsplash.com/photo-1527474305487-b87b222841cc?q=80&w=1024&auto=format&fit=crop"
    ];

    const spaces = [
      "https://images.unsplash.com/photo-1506318137071-a8e063b4bec0?q=80&w=1024&auto=format&fit=crop",
      "https://images.unsplash.com/photo-1451187580459-43490279c0fa?q=80&w=1024&auto=format&fit=crop",
      "https://images.unsplash.com/photo-1462331940025-496dfbfc7564?q=80&w=1024&auto=format&fit=crop",
      "https://images.unsplash.com/photo-1543722530-d2c32013a1e6?q=80&w=1024&auto=format&fit=crop",
      "https://images.unsplash.com/photo-1502134249126-9f3755a50d78?q=80&w=1024&auto=format&fit=crop"
    ];

    const cars = [
      "https://images.unsplash.com/photo-1503376780353-7e6692767b70?q=80&w=1024&auto=format&fit=crop",
      "https://images.unsplash.com/photo-1568605117036-5fe5e7bab0b7?q=80&w=1024&auto=format&fit=crop",
      "https://images.unsplash.com/photo-1617788138017-80ad40651399?q=80&w=1024&auto=format&fit=crop",
      "https://images.unsplash.com/photo-1583121274602-3e2820c69888?q=80&w=1024&auto=format&fit=crop",
      "https://images.unsplash.com/photo-1542282088-fe8426682b8f?q=80&w=1024&auto=format&fit=crop"
    ];

    const bikes = [
      "https://images.unsplash.com/photo-1558981806-ec527fa84c39?q=80&w=1024&auto=format&fit=crop",
      "https://images.unsplash.com/photo-1568772585407-9361f9bf3a87?q=80&w=1024&auto=format&fit=crop",
      "https://images.unsplash.com/photo-1485965120184-e220f721d03e?q=80&w=1024&auto=format&fit=crop",
      "https://images.unsplash.com/photo-1508847154043-be12a62861c1?q=80&w=1024&auto=format&fit=crop",
      "https://images.unsplash.com/photo-1484156818044-c040038b0719?q=80&w=1024&auto=format&fit=crop"
    ];

    const trucks = [
      "https://images.unsplash.com/photo-1586528116311-ad8dd3c8310d?q=80&w=1024&auto=format&fit=crop",
      "https://images.unsplash.com/photo-1592838064575-70ed626d3a0e?q=80&w=1024&auto=format&fit=crop",
      "https://images.unsplash.com/photo-1601584115197-04ecc0da31d7?q=80&w=1024&auto=format&fit=crop",
      "https://images.unsplash.com/photo-1501700490588-433b91815464?q=80&w=1024&auto=format&fit=crop",
      "https://images.unsplash.com/photo-1516576475522-e8f6cd9e8947?q=80&w=1024&auto=format&fit=crop"
    ];

    const vans = [
      "https://images.unsplash.com/photo-1527786356703-4b100091cd2c?q=80&w=1024&auto=format&fit=crop",
      "https://images.unsplash.com/photo-1551524559-8af4e6624178?q=80&w=1024&auto=format&fit=crop",
      "https://images.unsplash.com/photo-1494905998402-395d579af36f?q=80&w=1024&auto=format&fit=crop",
      "https://images.unsplash.com/photo-1561361513-2d000a50f0db?q=80&w=1024&auto=format&fit=crop",
      "https://images.unsplash.com/photo-1568605117036-5fe5e7bab0b7?q=80&w=1024&auto=format&fit=crop"
    ];

    const animals = [
      "https://images.unsplash.com/photo-1546182990-dffeafbe841d?q=80&w=1024&auto=format&fit=crop",
      "https://images.unsplash.com/photo-1484557985045-edf25e08da73?q=80&w=1024&auto=format&fit=crop",
      "https://images.unsplash.com/photo-1508817628294-5a453fa0b8fb?q=80&w=1024&auto=format&fit=crop",
      "https://images.unsplash.com/photo-1570042225831-d97fe7599985?q=80&w=1024&auto=format&fit=crop",
      "https://images.unsplash.com/photo-1598978213948-958b9fa573f7?q=80&w=1024&auto=format&fit=crop"
    ];

    const birds = [
      "https://images.unsplash.com/photo-1452570053594-1b985d6ea890?q=80&w=1024&auto=format&fit=crop",
      "https://images.unsplash.com/photo-1480044965905-02098d419e96?q=80&w=1024&auto=format&fit=crop",
      "https://images.unsplash.com/photo-1551085254-e96b210db58a?q=80&w=1024&auto=format&fit=crop",
      "https://images.unsplash.com/photo-1516233501014-447729555771?q=80&w=1024&auto=format&fit=crop",
      "https://images.unsplash.com/photo-1522850959074-b78b5f6b9c88?q=80&w=1024&auto=format&fit=crop"
    ];

    const foods = [
      "https://images.unsplash.com/photo-1555396273-367ea4eb4db5?q=80&w=1024&auto=format&fit=crop",
      "https://images.unsplash.com/photo-1514933651103-005eec06c04b?q=80&w=1024&auto=format&fit=crop",
      "https://images.unsplash.com/photo-1574096079513-d8259312b785?q=80&w=1024&auto=format&fit=crop",
      "https://images.unsplash.com/photo-1554118811-1e0d58224f24?q=80&w=1024&auto=format&fit=crop",
      "https://images.unsplash.com/photo-1590846406792-0adc7f938f1d?q=80&w=1024&auto=format&fit=crop"
    ];

    const defaults = [
      "https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=1024&auto=format&fit=crop",
      "https://images.unsplash.com/photo-1634017839464-5c339ebe3cb4?q=80&w=1024&auto=format&fit=crop",
      "https://images.unsplash.com/photo-1604871000636-074fa5117945?q=80&w=1024&auto=format&fit=crop",
      "https://images.unsplash.com/photo-1550684848-fac1c5b4e853?q=80&w=1024&auto=format&fit=crop",
      "https://images.unsplash.com/photo-1618005198143-e5284b519a7f?q=80&w=1024&auto=format&fit=crop"
    ];

    const keywords = prompt.toLowerCase();
    let selectedList = defaults;
    if (keywords.includes("city") || keywords.includes("skyline") || keywords.includes("metropolis") || keywords.includes("street")) {
      selectedList = cities;
    } else if (keywords.includes("robot") || keywords.includes("machine") || keywords.includes("cyborg") || keywords.includes("android") || keywords.includes("ai")) {
      selectedList = robots;
    } else if (keywords.includes("motorcycle") || keywords.includes("bike") || keywords.includes("bicycle") || keywords.includes("scooter")) {
      selectedList = bikes;
    } else if (keywords.includes("truck") || keywords.includes("lorry") || keywords.includes("pickup")) {
      selectedList = trucks;
    } else if (keywords.includes("van") || keywords.includes("minivan") || keywords.includes("camper")) {
      selectedList = vans;
    } else if (keywords.includes("car") || keywords.includes("vehicle") || keywords.includes("cyber")) {
      selectedList = cars;
    } else if (keywords.includes("space") || keywords.includes("galaxy") || keywords.includes("star") || keywords.includes("cosmos")) {
      selectedList = spaces;
    } else if (keywords.includes("food") || keywords.includes("restaurant") || keywords.includes("dine") || keywords.includes("hotel")) {
      selectedList = foods;
    } else if (keywords.includes("bird") || keywords.includes("eagle") || keywords.includes("owl") || keywords.includes("parrot") || keywords.includes("sparrow")) {
      selectedList = birds;
    } else if (keywords.includes("animal") || keywords.includes("lion") || keywords.includes("sheep") || keywords.includes("tiger") || keywords.includes("cow") || keywords.includes("dog") || keywords.includes("cat") || keywords.includes("deer")) {
      selectedList = animals;
    }

    // Deterministic selection using a simple prompt string hash
    let hash = 0;
    for (let i = 0; i < prompt.length; i++) {
      hash = prompt.charCodeAt(i) + ((hash << 5) - hash);
    }
    const index = Math.abs(hash) % selectedList.length;
    const backupImage = selectedList[index];

    generatedImage.onerror = null; // Prevent loop
    generatedImage.src = backupImage;
  };

  loadingBox.style.display = "block";
  resultBox.style.display = "none";

  try{
    // High-fidelity routing: check if running on static page vs Next.js live environment
    if (window.location.protocol === 'file:' || !window.location.host.includes('localhost')) {
      // Try to hit n8n image webhook directly
      try {
        const response = await fetch("https://trijeet12.app.n8n.cloud/webhook-test/image-generator", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ prompt: prompt })
        });
        const data = await response.json();
        
        // Check for Pollinations rate-limit error returned by n8n
        if (data && (data.x402Version || (data.error && String(data.error).includes("Queue full")))) {
          throw new Error("Pollinations rate limit detected in webhook response");
        }

        const imageUrl = data.image || data.imageUrl || data.url;
        if (imageUrl) {
          generatedImage.src = imageUrl;
          return;
        }
      } catch (webhookErr) {
        console.warn("Direct n8n webhook offline, rate limited, or CORS-restricted. Engaging fallback.");
        if (webhookErr.message && webhookErr.message.includes("rate limit")) {
          generatedImage.onerror();
          return;
        }
        // Direct Pollinations AI generation fallback (client-side)
        const encodedPrompt = encodeURIComponent(prompt.trim());
        const seed = Math.floor(Math.random() * 1000000);
        generatedImage.src = `https://image.pollinations.ai/prompt/${encodedPrompt}?width=1024&height=1024&nologo=true&seed=${seed}`;
        return;
      }

      // Direct high-performance Pollinations AI synthesis fallback (Client Side)
      const encodedPrompt = encodeURIComponent(prompt.trim());
      const seed = Math.floor(Math.random() * 1000000);
      generatedImage.src = `https://image.pollinations.ai/prompt/${encodedPrompt}?width=1024&height=1024&nologo=true&seed=${seed}`;
    } else {
      // Call Next.js live route
      const response = await fetch("/api/generate-image", {
        method:"POST",
        headers:{
          "Content-Type":"application/json"
        },
        body:JSON.stringify({
          prompt:prompt
        })
      });

      const data = await response.json();
      if (data.imageUrl) {
        generatedImage.src = data.imageUrl;
      } else {
        throw new Error(data.error || "Generation failed");
      }
    }
  }catch(error){
    console.warn("Primary API fallback caught. Executing client-side synthesis failover.");
    if (error.message && (error.message.includes("Queue full") || error.message.includes("rate limit"))) {
      generatedImage.onerror();
      return;
    }
    const encodedPrompt = encodeURIComponent(prompt.trim());
    const seed = Math.floor(Math.random() * 1000000);
    generatedImage.src = `https://image.pollinations.ai/prompt/${encodedPrompt}?width=1024&height=1024&nologo=true&seed=${seed}`;
  }

});

</script>
